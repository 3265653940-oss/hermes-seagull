name: Build Samsung Popup Shield APK

on:
  push:
    branches:
      - chatgpt/samsung-popup-shield-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: chatgpt-build/samsung-popup-shield
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        run: cp chatgpt-build/samsung-popup-shield/app/build/outputs/apk/debug/app-debug.apk SamsungPopupShield.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SamsungPopupShield-APK
          path: SamsungPopupShield.apk
          if-no-files-found: error
